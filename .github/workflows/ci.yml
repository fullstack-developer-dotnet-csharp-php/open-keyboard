name: Build & Test Open Keyboard

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew || true

      - name: Build Android App & Run Tests
        working-directory: ./android
        run: ./gradlew test

  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode 15
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Build iOS App & Extension
        working-directory: ./ios
        run: |
          xcodebuild -project OpenKeyboard.xcodeproj -scheme OpenKeyboard -destination 'generic/platform=iOS Simulator' build CODE_SIGNING_ALLOWED=NO
